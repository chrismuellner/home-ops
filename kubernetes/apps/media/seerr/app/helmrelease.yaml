---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &release seerr
spec:
  releaseName: *release
  chartRef:
    kind: OCIRepository
    name: seerr
  interval: 30m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.0

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}

            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        ports:
          http:
            port: 5055

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Seerr"
          gethomepage.dev/group: "Media"
          gethomepage.dev/weight: "20"
          gethomepage.dev/icon: "jellyseerr"
          gethomepage.dev/href: "https://seerr.muellner.dev"
          gethomepage.dev/app: "seerr"
          gethomepage.dev/widget.type: "seerr"
          gethomepage.dev/widget.url: "http://seerr.media:5055"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SEERR_KEY}}" }}'
        hostnames:
          - "seerr.muellner.dev"
          - "jellyseerr.muellner.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: seerr
        globalMounts:
          - path: /app/config
