---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: seerr
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: seerr
  # Keep the Gateway-wide defaults (compression, buffer limit, timeouts) from network/envoy
  mergeType: StrategicMerge
  # Shared buckets per Envoy instance
  rateLimit:
    type: Local
    local:
      rules:
        # Sign-in: Jellyfin password, local, Plex, Quick Connect initiate/authenticate (status polling is GET)
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /api/v1/auth
              methods:
                - value: POST
          limit:
            requests: 30
            unit: Minute
