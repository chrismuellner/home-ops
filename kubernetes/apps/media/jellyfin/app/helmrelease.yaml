---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &release jellyfin
spec:
  releaseName: *release
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 30m
  values:
    controllers:
      main:
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: jellyfin
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: 12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 300m
                memory: 2Gi
              limits:
                memory: 8Gi

    service:
      app:
        ports:
          http:
            port: 8096

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Jellyfin"
          gethomepage.dev/group: "Media"
          gethomepage.dev/weight: "10"
          gethomepage.dev/icon: "jellyfin"
          gethomepage.dev/href: "https://jellyfin.muellner.dev"
          gethomepage.dev/app: "jellyfin"
          gethomepage.dev/widget.type: "jellyfin"
          gethomepage.dev/widget.url: "http://jellyfin.media:8096"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_KEY}}" }}'
          gethomepage.dev/widget.version: "2"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "true"
        hostnames:
          - "jellyfin.muellner.dev"
        # LAN DNS resolves to envoy-internal, public DNS to envoy-external
        parentRefs:
          - name: envoy-internal
            namespace: network
          - name: envoy-external
            namespace: network

    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      shows:
        type: nfs
        server: nas.local
        path: /var/nfs/shared/shows
        globalMounts:
          - path: /data/media/shows
      movies:
        type: nfs
        server: nas.local
        path: /var/nfs/shared/movies
        globalMounts:
          - path: /data/media/movies
