---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &release jellyfin
spec:
  releaseName: *release
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 30m
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: 10.11.11
            resources:
              requests:
                cpu: 300m
                memory: 2Gi
              limits:
                memory: 8Gi

    service:
      app:
        ports:
          http:
            port: 8096

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Jellyfin"
          gethomepage.dev/group: "Media"
          gethomepage.dev/icon: "jellyfin"
          gethomepage.dev/href: "https://jellyfin.muellner.dev"
          gethomepage.dev/app: "jellyfin"
          gethomepage.dev/widget.type: "jellyfin"
          gethomepage.dev/widget.url: "http://jellyfin.media:8096"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_KEY}}" }}'
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "true"
        hostnames:
          - "jellyfin.muellner.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      shows:
        existingClaim: pvc-shows
        globalMounts:
          - path: /data/media/shows
      movies:
        existingClaim: pvc-movies
        globalMounts:
          - path: /data/media/movies
