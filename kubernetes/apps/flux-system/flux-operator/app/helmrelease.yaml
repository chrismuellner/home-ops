---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 30m
  values:
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Flux"
          gethomepage.dev/group: "System"
          gethomepage.dev/weight: "10"
          gethomepage.dev/icon: "flux-cd"
          gethomepage.dev/href: "https://flux-operator.muellner.dev"
          gethomepage.dev/app: "flux-operator"
        hostnames:
          - flux-operator.muellner.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
      networkPolicy:
        create: false
