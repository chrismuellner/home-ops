---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: github-webhook
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-webhook
  # Keep the Gateway-wide defaults (compression, buffer limit, timeouts) from network/envoy
  mergeType: StrategicMerge
  # GitHub sends one delivery per push; a burst of Renovate merges stays well below this
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 30
            unit: Minute
