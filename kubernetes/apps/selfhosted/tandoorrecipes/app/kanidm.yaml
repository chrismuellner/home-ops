---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: tandoor-users
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: tandoor_users
  members:
    - admins
    - household
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: tandoor
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Tandoor Recipes
  origin: https://recipes.muellner.dev/
  redirectUrl:
    - https://recipes.muellner.dev/accounts/oidc/kanidm/login/callback/
  scopeMap:
    - group: tandoor_users@idm.muellner.dev
      scopes:
        - openid
        - profile
        - email
  strictRedirectUrl: true
  preferShortUsername: true
  disableConsentPrompt: true
  # Official Tandoor logo, https://github.com/TandoorRecipes/recipes
  image:
    url: https://raw.githubusercontent.com/TandoorRecipes/recipes/develop/docs/logo_color.svg
