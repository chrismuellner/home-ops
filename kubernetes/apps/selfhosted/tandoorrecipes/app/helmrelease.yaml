---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &release tandoorrecipes
spec:
  releaseName: *release
  chartRef:
    kind: OCIRepository
    name: tandoorrecipes
  interval: 30m
  values:
    controllers:
      web:
        containers:
          main:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.2
            env:
              # Kanidm OIDC. Env vars render alphabetically, so OIDC_CLIENT_SECRET is defined before
              # SOCIALACCOUNT_PROVIDERS, which references it as $(OIDC_CLIENT_SECRET).
              DATABASE_URL: sqlite://localhost//opt/recipes/database/db.sqlite3 # db string compliant with custom parser used by tandoorrecipes
              ALLOWED_HOSTS: recipes.muellner.dev,tandoorrecipes.selfhosted
              ENABLE_SIGNUP: "0"
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              SOCIAL_DEFAULT_ACCESS: "1"
              SOCIAL_DEFAULT_GROUP: user
              SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
              SOCIALACCOUNT_LOGIN_ON_GET: "1"
              # SSO only: allauth disables local login, signup and password reset; hide the form too
              SOCIALACCOUNT_ONLY: "1"
              HIDE_LOGIN_FORM: "1"
              SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"kanidm","name":"Kanidm","client_id":"tandoor","secret":"$(OIDC_CLIENT_SECRET)","settings":{"server_url":"https://idm.muellner.dev/oauth2/openid/tandoor/.well-known/openid-configuration"}}]}}'
            envFrom:
              - secretRef:
                  name: tandoorrecipes-secret

    service:
      web:
        ports:
          http:
            port: 80

    route:
      web:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Tandoor"
          gethomepage.dev/group: "Self-Hosted"
          gethomepage.dev/weight: "40"
          gethomepage.dev/icon: "tandoor-recipes"
          gethomepage.dev/href: "https://recipes.muellner.dev"
          gethomepage.dev/app: "tandoorrecipes"
          gethomepage.dev/widget.type: "tandoor"
          gethomepage.dev/widget.url: "http://tandoorrecipes.selfhosted"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_TANDOOR_KEY}}" }}'
        hostnames:
          - recipes.muellner.dev
        # LAN DNS resolves to envoy-internal, public DNS to envoy-external
        parentRefs:
          - name: envoy-internal
            namespace: network
          - name: envoy-external
            namespace: network

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: tandoorrecipes
        advancedMounts:
          web:
            main:
              - path: /opt/recipes/staticfiles
                subPath: staticfiles
              - path: /opt/recipes/mediafiles
                subPath: mediafiles
              - path: /opt/recipes/database
                subPath: database
