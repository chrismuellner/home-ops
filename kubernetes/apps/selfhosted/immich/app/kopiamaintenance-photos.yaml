---
# Maintenance for the dedicated Hetzner SFTP repo — the shared-repo
# KopiaMaintenance in system/volsync does not cover it.
# The maintenance CronJob loads its repository secret via envFrom and, unlike
# the ReplicationSource mover, never writes SFTP_KEY_FILE to a file. So it gets
# its own secret where SFTP_KEY_FILE is a path, and the key from the backup
# secret is mounted there.
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: immich-photos
spec:
  enabled: true
  trigger:
    schedule: 0 4 * * 0
  cacheCapacity: 10Gi
  cacheStorageClassName: host-zfs
  moverVolumes:
    - mountPath: sftp-key
      volumeSource:
        secret:
          secretName: immich-photos-volsync-secret
          items:
            - key: SFTP_KEY_FILE
              path: id_ed25519
          defaultMode: 288 # 0440, group-readable via the pod's fsGroup 1000
  repository:
    repository: immich-photos-maintenance-secret
