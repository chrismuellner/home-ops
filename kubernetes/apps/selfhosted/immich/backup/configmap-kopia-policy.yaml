---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-photos-kopia-policy
data:
  # Applied by the Kopia mover via `kopia policy set --global`.
  # thumbs/ and encoded-video/ are regenerable by Immich (~320G saved).
  global-policy.json: |-
    {
      "files": {
        "ignore": [
          "/immich/thumbs",
          "/immich/encoded-video",
          ".DS_Store"
        ]
      }
    }
