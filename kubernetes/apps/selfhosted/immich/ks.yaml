---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kanidm
    - name: kopiur-repositories
    - name: openebs
  interval: 10m
  path: ./kubernetes/apps/selfhosted/immich/app
  postBuild:
    substitute:
      APP: immich
      VOLSYNC_CAPACITY: 10Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
  wait: true
  targetNamespace: selfhosted
---
# Off-site kopiur backup of the photos NFS share (dedicated Hetzner SFTP repo)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-photos-backup
  namespace: flux-system
spec:
  dependsOn:
    - name: immich
    - name: kopiur
  interval: 10m
  path: ./kubernetes/apps/selfhosted/immich/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
  wait: true
  targetNamespace: selfhosted
