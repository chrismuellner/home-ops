---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: paperless-admins
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: paperless_admins
  members:
    - admins
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: paperless-users
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: paperless_users
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: paperless
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Paperless-ngx
  origin: https://paperless.muellner.dev/
  redirectUrl:
    - https://paperless.muellner.dev/accounts/oidc/kanidm/login/callback/
  scopeMap:
    - group: paperless_admins@idm.muellner.dev
      scopes:
        - openid
        - profile
        - email
        - groups
    - group: paperless_users@idm.muellner.dev
      scopes:
        - openid
        - profile
        - email
        - groups
  strictRedirectUrl: true
  preferShortUsername: true
  disableConsentPrompt: true
  # Official Paperless-ngx logo (GPL-3.0), https://github.com/paperless-ngx/paperless-ngx
  image:
    url: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/dev/docs/assets/logo_leaf.svg
