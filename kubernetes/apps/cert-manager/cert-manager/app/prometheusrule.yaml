---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerAbsent
          expr: absent(up{job="cert-manager"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: cert-manager has disappeared from Prometheus service discovery.
        - alert: CertManagerCertNotReady
          expr: |-
            max by (name, exported_namespace, condition) (
              certmanager_certificate_ready_status{condition!="True"} == 1
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready.
        # cert-manager renews at 2/3 of the lifetime, so an overdue renewal
        # catches failures independent of the certificate lifetime
        - alert: CertManagerCertRenewalOverdue
          expr: |-
            time() - max by (name, exported_namespace) (certmanager_certificate_renewal_timestamp_seconds) > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} should have
              been renewed over a day ago.
        - alert: CertManagerCertExpiringSoon
          expr: |-
            max by (name, exported_namespace) (certmanager_certificate_expiration_timestamp_seconds) - time() < 7 * 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: >-
              Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in
              {{ $value | humanizeDuration }}.
        - alert: CertManagerHittingRateLimits
          expr: sum by (host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: cert-manager is hitting the Let's Encrypt rate limits for {{ $labels.host }}.
