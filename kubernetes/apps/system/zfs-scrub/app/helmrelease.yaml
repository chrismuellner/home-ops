---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zfs-scrub
spec:
  chartRef:
    kind: OCIRepository
    name: zfs-scrub
  interval: 30m
  values:
    controllers:
      zfs-scrub:
        type: cronjob
        cronjob:
          schedule: "0 1 * * 0"
          concurrencyPolicy: Forbid
        containers:
          app:
            # same image as zfs-exporter: pinned and its zfs userland matches the
            # talos zfs extension; command replaces the exporter entrypoint
            image:
              repository: ghcr.io/mirceanton/zfs-exporter
              tag: 2.5.0@sha256:7045c77513328508e9ac6a5672ea6022d6776dd423ae592e826fdb50960377c2
            command:
              - "/scripts/zfs_scrub_task.sh"
            env:
              ZPOOL: zfspv-pool
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
    persistence:
      scripts:
        type: configMap
        name: zfs-scrub-scripts
        defaultMode: 0755
        globalMounts:
          - path: /scripts
      dev:
        type: hostPath
        hostPath: /dev
        hostPathType: Directory
        globalMounts:
          - path: /dev
