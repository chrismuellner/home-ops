---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncVolumeOutOfSync
          expr: volsync_volume_out_of_sync{role="source"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: VolSync backup is out of sync
            description: >-
              ReplicationSource {{ $labels.obj_namespace }}/{{ $labels.obj_name }}
              has not completed a sync within its schedule.
        - alert: VolSyncMoverJobFailed
          # kopia-maint-* cronjobs are covered by CronJobLastRunFailed
          expr: kube_job_failed{job_name=~"volsync-.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: VolSync mover job failed
            description: >-
              Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed pods.
              Check the mover logs.
        # VolSyncVolumeOutOfSync only fires once the next scheduled sync is
        # missed (~a day for daily backups); movers normally finish in minutes
        - alert: VolSyncMoverJobStuck
          expr: |-
            time() - max by (namespace, job_name) (
              kube_job_status_start_time{job_name=~"volsync-.*"}
                and on (namespace, job_name)
              kube_job_status_active > 0
            ) > 7200
          labels:
            severity: warning
          annotations:
            summary: VolSync mover job is stuck
            description: >-
              Job {{ $labels.namespace }}/{{ $labels.job_name }} has been running
              for more than 2 hours. Check whether its pod or PVC is pending.
