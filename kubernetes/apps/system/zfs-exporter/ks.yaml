---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zfs-exporter
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: zfs-exporter
  interval: 30m
  path: ./kubernetes/apps/system/zfs-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
  targetNamespace: system
