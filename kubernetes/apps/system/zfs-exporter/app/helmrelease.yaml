---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zfs-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: zfs-exporter
  interval: 30m
  values:
    controllers:
      zfs-exporter:
        containers:
          app:
            # pdf/zfs_exporter has no official image; this one ships the same zfs
            # userland version as the talos zfs extension
            image:
              repository: ghcr.io/mirceanton/zfs-exporter
              tag: 2.5.0@sha256:7045c77513328508e9ac6a5672ea6022d6776dd423ae592e826fdb50960377c2
            args:
              - --web.disable-exporter-metrics
            # queries pools and datasets through /dev/zfs
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        controller: zfs-exporter
        ports:
          http:
            port: 9134
    serviceMonitor:
      app:
        serviceName: zfs-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    persistence:
      dev-zfs:
        type: hostPath
        hostPath: /dev/zfs
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/zfs
