---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.5
  policy:
    rebootMode: default
  # Single node: tuppr disables talosctl's own drain (it would evict its own
  # upgrade pod), so without this the reboot leaves every pod behind as
  # Completed/Error. Deprecated, but the only option that drains a single node.
  drain:
    enabled: true
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
  maintenance:
    windows:
      - start: "0 2 * * 0" # Sunday 02:00
        duration: "4h"
        timezone: "UTC"
