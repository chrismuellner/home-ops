---
# Loads default set of integrations. Do not remove.
default_config:

frontend:

# Text to speech
tts:
  - platform: google_translate

# automation: !include automations.yaml
# script: !include scripts.yaml
# scene: !include scenes.yaml

binary_sensor: !include binary_sensor.yaml
sensor: !include sensor.yaml
template: !include template.yaml

python_script:

homeassistant:
  name: Home
  internal_url: https://home.muellner.dev
  # Kanidm SSO (auth_oidc below) is the only login method; an empty list disables HA's built-in
  # password provider
  auth_providers: []

# Requests arrive through envoy-external, which sets X-Forwarded-For to the real client IP and
# discards any client-supplied value
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.244.0.0/16

# Kanidm SSO via hass-oidc-auth (HACS)
auth_oidc:
  client_id: homeassistant
  discovery_url: https://idm.muellner.dev/oauth2/openid/homeassistant/.well-known/openid-configuration
  id_token_signing_alg: ES256
  features:
    force_https: true
    automatic_person_creation: true
  roles:
    admin: homeassistant_admins@idm.muellner.dev
    user: homeassistant_users@idm.muellner.dev
