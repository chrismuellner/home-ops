---
# Loads default set of integrations. Do not remove.
default_config:

frontend:

# Text to speech
tts:
  - platform: google_translate

# automation: !include automations.yaml
# script: !include scripts.yaml
# scene: !include scenes.yaml

binary_sensor: !include binary_sensor.yaml
sensor: !include sensor.yaml
template: !include template.yaml

python_script:

homeassistant:
  name: Home
  internal_url: https://home.muellner.dev
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 192.168.0.0/16

# Kanidm SSO via hass-oidc-auth (HACS). Password and trusted-network login stay as fallbacks;
# the password form is also reachable at /?skip_oidc_redirect=true.
auth_oidc:
  client_id: homeassistant
  discovery_url: https://idm.muellner.dev/oauth2/openid/homeassistant/.well-known/openid-configuration
  id_token_signing_alg: ES256
  features:
    force_https: true
    automatic_person_creation: true
    # TEMPORARY: link first OIDC logins to existing HA users with the same username. Remove after
    # linking; it bypasses MFA for an exact username match.
    automatic_user_linking: true
  roles:
    admin: homeassistant_admins@idm.muellner.dev
    user: homeassistant_users@idm.muellner.dev
