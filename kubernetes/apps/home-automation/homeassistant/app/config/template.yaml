---
- trigger:
    - trigger: state
      entity_id: weather.forecast_home
    - trigger: time_pattern
      hours: "/1"
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_data
  sensor:
    - name: "Weather Forecast Day 0 High"
      unique_id: weather_forecast_day_0_high
      default_entity_id: sensor.weather_forecast_day_0_high
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[0].temperature | default("N/A") }}'
    - name: "Weather Forecast Day 0 Low"
      unique_id: weather_forecast_day_0_low
      default_entity_id: sensor.weather_forecast_day_0_low
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[0].templow | default("N/A") }}'
    - name: "Weather Forecast Day 0 Condition"
      unique_id: weather_forecast_day_0_condition
      default_entity_id: sensor.weather_forecast_day_0_condition
      state: '{{ forecast_data["weather.forecast_home"].forecast[0].condition | default("unknown") }}'
    - name: "Weather Forecast Day 1 High"
      unique_id: weather_forecast_day_1_high
      default_entity_id: sensor.weather_forecast_day_1_high
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[1].temperature | default("N/A") }}'
    - name: "Weather Forecast Day 1 Low"
      unique_id: weather_forecast_day_1_low
      default_entity_id: sensor.weather_forecast_day_1_low
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[1].templow | default("N/A") }}'
    - name: "Weather Forecast Day 1 Condition"
      unique_id: weather_forecast_day_1_condition
      default_entity_id: sensor.weather_forecast_day_1_condition
      state: '{{ forecast_data["weather.forecast_home"].forecast[1].condition | default("unknown") }}'
    - name: "Weather Forecast Day 2 High"
      unique_id: weather_forecast_day_2_high
      default_entity_id: sensor.weather_forecast_day_2_high
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[2].temperature | default("N/A") }}'
    - name: "Weather Forecast Day 2 Low"
      unique_id: weather_forecast_day_2_low
      default_entity_id: sensor.weather_forecast_day_2_low
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[2].templow | default("N/A") }}'
    - name: "Weather Forecast Day 2 Condition"
      unique_id: weather_forecast_day_2_condition
      default_entity_id: sensor.weather_forecast_day_2_condition
      state: '{{ forecast_data["weather.forecast_home"].forecast[2].condition | default("unknown") }}'
    - name: "Weather Forecast Day 3 High"
      unique_id: weather_forecast_day_3_high
      default_entity_id: sensor.weather_forecast_day_3_high
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[3].temperature | default("N/A") }}'
    - name: "Weather Forecast Day 3 Low"
      unique_id: weather_forecast_day_3_low
      default_entity_id: sensor.weather_forecast_day_3_low
      unit_of_measurement: "°C"
      state: '{{ forecast_data["weather.forecast_home"].forecast[3].templow | default("N/A") }}'
    - name: "Weather Forecast Day 3 Condition"
      unique_id: weather_forecast_day_3_condition
      default_entity_id: sensor.weather_forecast_day_3_condition
      state: '{{ forecast_data["weather.forecast_home"].forecast[3].condition | default("unknown") }}'
- trigger:
    - trigger: time_pattern
      minutes: "/15"
  action:
    - action: calendar.get_events
      target:
        entity_id:
          - calendar.shared
      data:
        duration:
          days: 14
      response_variable: calendar_events
    - action: python_script.esp_calendar_data_conversion
      data:
        calendar: "{{ calendar_events }}"
        now: "{{ now().isoformat().split('T')[0] }}"
        nr_entries: 8
        prefix_length: 3
        prefix_separator: ": "
      response_variable: output
  sensor:
    - name: ESP Calendar Data
      unique_id: esp_calendar_data
      state: "OK"
      attributes:
        entries: "{{ output.entries }}"
        closest_end_time: "{{ output.closest_end_time }}"
# Washer program tracking. Cycle start/end comes from the Zigbee plug, because SmartThings
# silently drops events (home-assistant/core#176244); SmartThings only adds temperature and
# drying. All logic lives in the action's variables so every entity reads the pre-update state.
# Measured profiles: sensitive 30 ~1h26/0.3 kWh, wash 30 ~3h20/0.6 kWh, drying adds ~0.8 kWh.
- trigger:
    - trigger: numeric_state
      id: power_on
      entity_id: sensor.plug_washer_power
      above: 15
      for: "00:02:00"
    # Inside a run the plug never stays below 5 W for more than 20 s
    - trigger: numeric_state
      id: power_off
      entity_id: sensor.plug_washer_power
      below: 3
      for: "00:01:00"
    - trigger: state
      id: heat_window
      entity_id: sensor.washer_cycle
      to: running
      for: "00:40:00"
    - trigger: state
      id: smartthings
      entity_id:
        - select.washing_machine_water_temperature
        - sensor.washing_machine_job_state
        - sensor.washing_machine_machine_state
      not_to:
        - unavailable
        - unknown
    - trigger: homeassistant
      id: ha_start
      event: start
  action:
    - variables:
        cycle: sensor.washer_cycle
        was_running: "{{ is_state(cycle, 'running') }}"
        energy_now: "{{ states('sensor.plug_washer_energy') | float(none) }}"
        st_running: "{{ is_state('sensor.washing_machine_machine_state', ['run', 'pause']) }}"
        temp_now: "{{ states('select.washing_machine_water_temperature') }}"
        temp_valid: "{{ st_running and temp_now not in ['none', 'unknown', 'unavailable'] }}"
        starting: "{{ trigger.id == 'power_on' and not was_running }}"
        ending: "{{ trigger.id == 'power_off' and was_running }}"
        started: >-
          {{ now().isoformat() if starting else state_attr(cycle, 'started') }}
        start_energy: >-
          {{ energy_now if starting else state_attr(cycle, 'start_energy') }}
        heat_energy: >-
          {% if starting %}{{ none }}
          {% elif trigger.id == 'heat_window' and was_running and start_energy is not none and energy_now is not none %}{{ (energy_now - start_energy) | round(2) }}
          {% else %}{{ state_attr(cycle, 'heat_energy') }}{% endif %}
        temperature: >-
          {% if (starting or was_running) and temp_valid %}{{ temp_now }}
          {% elif starting %}{{ none }}
          {% else %}{{ state_attr(cycle, 'temperature') }}{% endif %}
        dried: >-
          {% if starting %}{{ false }}
          {% elif was_running and is_state('sensor.washing_machine_job_state', 'drying') %}{{ true }}
          {% else %}{{ state_attr(cycle, 'dried') | default(false, true) }}{% endif %}
        duration_min: >-
          {{ ((now() - as_datetime(started)).total_seconds() / 60) | round(0) if ending and started else none }}
        energy_kwh: >-
          {{ (energy_now - start_energy) | round(2) if ending and energy_now is not none and start_energy is not none else none }}
        program: >-
          {% if not ending %}
          {% elif duration_min is none or duration_min < 20 %}ignored
          {% elif dried or (energy_kwh is not none and energy_kwh >= 0.9) %}
            {% if temperature | string == '60' %}wash_60_dry
            {% elif temperature | string == '30' %}wash_30_dry
            {% elif temperature is none and heat_energy is not none %}{{ 'wash_60_dry' if heat_energy >= 0.5 else 'wash_30_dry' }}
            {% else %}other_dry{% endif %}
          {% elif duration_min < 150 %}sensitive_30
          {% else %}wash_30{% endif %}
  sensor:
    - name: Washer cycle
      unique_id: washer_cycle
      default_entity_id: sensor.washer_cycle
      icon: mdi:washing-machine
      state: >-
        {% if starting %}running{% elif ending %}idle{% else %}{{ 'running' if was_running else 'idle' }}{% endif %}
      attributes:
        started: "{{ started }}"
        start_energy: "{{ start_energy }}"
        heat_energy: "{{ heat_energy }}"
        temperature: "{{ temperature }}"
        dried: "{{ dried }}"
        last_program: "{{ program if ending else state_attr(cycle, 'last_program') }}"
        last_end: "{{ now().isoformat() if ending else state_attr(cycle, 'last_end') }}"
        last_duration_min: "{{ duration_min if ending else state_attr(cycle, 'last_duration_min') }}"
        last_energy_kwh: "{{ energy_kwh if ending else state_attr(cycle, 'last_energy_kwh') }}"
    # Each keeps its value until a cycle of its program ends; the seeds are the last runs found
    # in history (sensitive and wash 30 confirmed on 2026-11-02, 60 + dry never confirmed)
    - name: Washer last sensitive 30
      unique_id: washer_last_sensitive_30
      default_entity_id: sensor.washer_last_sensitive_30
      device_class: timestamp
      icon: mdi:feather
      state: >-
        {% if program == 'sensitive_30' %}{{ now().isoformat() }}
        {% elif this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
        {% else %}2026-11-02T11:15:00+01:00{% endif %}
      attributes:
        duration_min: "{{ duration_min if program == 'sensitive_30' else this.attributes.get('duration_min', 86) }}"
        energy_kwh: "{{ energy_kwh if program == 'sensitive_30' else this.attributes.get('energy_kwh', 0.32) }}"
    - name: Washer last wash 30
      unique_id: washer_last_wash_30
      default_entity_id: sensor.washer_last_wash_30
      device_class: timestamp
      icon: mdi:washing-machine
      state: >-
        {% if program == 'wash_30' %}{{ now().isoformat() }}
        {% elif this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
        {% else %}2026-11-02T14:38:00+01:00{% endif %}
      attributes:
        duration_min: "{{ duration_min if program == 'wash_30' else this.attributes.get('duration_min', 201) }}"
        energy_kwh: "{{ energy_kwh if program == 'wash_30' else this.attributes.get('energy_kwh', 0.63) }}"
    - name: Washer last wash 30 dry
      unique_id: washer_last_wash_30_dry
      default_entity_id: sensor.washer_last_wash_30_dry
      device_class: timestamp
      icon: mdi:tumble-dryer
      state: >-
        {% if program == 'wash_30_dry' %}{{ now().isoformat() }}
        {% elif this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
        {% else %}2026-10-31T14:03:00+01:00{% endif %}
      attributes:
        duration_min: "{{ duration_min if program == 'wash_30_dry' else this.attributes.get('duration_min', 222) }}"
        energy_kwh: "{{ energy_kwh if program == 'wash_30_dry' else this.attributes.get('energy_kwh', 1.18) }}"
    - name: Washer last wash 60 dry
      unique_id: washer_last_wash_60_dry
      default_entity_id: sensor.washer_last_wash_60_dry
      device_class: timestamp
      icon: mdi:thermometer-high
      state: >-
        {% if program == 'wash_60_dry' %}{{ now().isoformat() }}
        {% elif this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
        {% else %}{{ none }}{% endif %}
      attributes:
        duration_min: "{{ duration_min if program == 'wash_60_dry' else this.attributes.get('duration_min') }}"
        energy_kwh: "{{ energy_kwh if program == 'wash_60_dry' else this.attributes.get('energy_kwh') }}"
