---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
spec:
  chartRef:
    kind: OCIRepository
    name: homeassistant
  interval: 30m
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            # Rootless build of Home Assistant; the official image needs root for s6
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Always for the first rollout, so kubelet makes the files root wrote
        # with 0600 group-readable; then back to OnRootMismatch
        fsGroupChangePolicy: Always

    service:
      main:
        ports:
          http:
            port: 8123

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Home Assistant"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/weight: "10"
          gethomepage.dev/icon: "home-assistant"
          gethomepage.dev/href: "https://home.muellner.dev"
          gethomepage.dev/app: "homeassistant"
          gethomepage.dev/widget.type: "homeassistant"
          gethomepage.dev/widget.url: "http://homeassistant.home-automation:8123"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}" }}'
        hostnames:
          - "home.muellner.dev"
        # LAN DNS resolves home.muellner.dev to envoy-internal, public DNS to envoy-external
        parentRefs:
          - name: envoy-internal
            namespace: network
          - name: envoy-external
            namespace: network

    persistence:
      configuration-file:
        type: configMap
        name: homeassistant-config
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
      config:
        existingClaim: homeassistant-config
        globalMounts:
          - path: /config
      # Requirements of custom integrations; rebuilt by the image on demand, so
      # it stays out of the config volume and its backups
      venv:
        type: emptyDir
        globalMounts:
          - path: /config/.venv
      binary-sensor-file:
        type: configMap
        name: homeassistant-binary-sensor
        globalMounts:
          - path: /config/binary_sensor.yaml
            subPath: binary_sensor.yaml
      sensor-file:
        type: configMap
        name: homeassistant-sensor
        globalMounts:
          - path: /config/sensor.yaml
            subPath: sensor.yaml
      template-file:
        type: configMap
        name: homeassistant-template
        globalMounts:
          - path: /config/template.yaml
            subPath: template.yaml
