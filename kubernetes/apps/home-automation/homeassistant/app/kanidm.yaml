---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: homeassistant-admins
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: homeassistant_admins
  members:
    - admins
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: homeassistant-users
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: homeassistant_users
  members:
    - household
---
# Public client (no secret): hass-oidc-auth recommends this, protected by PKCE and exact redirect URLs.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: homeassistant
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Home Assistant
  public: true
  origin: https://home.muellner.dev/auth/oidc/welcome
  redirectUrl:
    - https://home.muellner.dev/auth/oidc/callback
  scopeMap:
    - group: homeassistant_admins@idm.muellner.dev
      scopes:
        - openid
        - profile
        - email
        - groups
    - group: homeassistant_users@idm.muellner.dev
      scopes:
        - openid
        - profile
        - email
        - groups
  strictRedirectUrl: true
  preferShortUsername: true
  disableConsentPrompt: true
  # Official Home Assistant brand icon, https://brands.home-assistant.io
  image:
    url: https://brands.home-assistant.io/homeassistant/icon.png
