---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 30m
  values:
    controllers:
      mosquitto:
        initContainers:
          init-passwd:
            image:
              repository: eclipse-mosquitto
              tag: 2.0.22
            command:
              - /bin/sh
              - -c
              - mosquitto_passwd -b -c /passwd/passwords.txt $(MQTT_USERNAME) $(MQTT_PASSWORD)
            envFrom:
              - secretRef:
                  name: mosquitto-credentials
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.0.22
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}

    # The image's mosquitto user; the broker already dropped to it, and its
    # data is owned by it
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: mosquitto
        ports:
          http:
            port: 1883

    persistence:
      configuration-file:
        type: configMap
        name: mosquitto-conf
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      passwd:
        type: emptyDir
        advancedMounts:
          mosquitto:
            init-passwd:
              - path: /passwd
            app:
              - path: /mosquitto/config/passwords.txt
                subPath: passwords.txt
      config:
        existingClaim: mosquitto-config
        globalMounts:
          - path: /mosquitto/data
            subPath: data
          - path: /mosquitto/log
            subPath: log
