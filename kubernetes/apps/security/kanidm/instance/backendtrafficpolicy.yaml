---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kanidm
spec:
  # HTTPRoute generated by kaniop from spec.gateway in kanidm.yaml
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kanidm
  # Keep the Gateway-wide defaults (compression, buffer limit, timeouts) from network/envoy
  mergeType: StrategicMerge
  # Throttle login attempts. Local rate limits can't bucket per client IP, so each rule is one
  # shared bucket per Envoy instance; existing sessions and OAuth2 flows are unaffected.
  rateLimit:
    type: Local
    local:
      rules:
        # Web UI login steps (begin, pw, totp, passkey, ...)
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /ui/login
              methods:
                - value: POST
          limit:
            requests: 30
            unit: Minute
        # API/CLI login
        - clientSelectors:
            - path:
                type: PathPrefix
                value: /v1/auth
              methods:
                - value: POST
          limit:
            requests: 30
            unit: Minute
