---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "grafana"
    gethomepage.dev/href: "https://grafana.muellner.dev"
    gethomepage.dev/app: "grafana"
    gethomepage.dev/pod-selector: "app=grafana"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.url: "http://grafana-service.observability:3000"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
spec:
  hostnames:
    - grafana.muellner.dev
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
