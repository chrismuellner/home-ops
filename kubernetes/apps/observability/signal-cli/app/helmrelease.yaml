---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &release signal-cli
spec:
  releaseName: *release
  chartRef:
    kind: OCIRepository
    name: signal-cli
  interval: 30m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/bbernhard/signal-cli-rest-api
              tag: "0.101"
            env:
              MODE: json-rpc
              PORT: &port 8080
              TZ: Europe/Vienna
              # s6-overlay rejects the root-owned emptyDir on /run without this
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              ENABLE_PLUGINS: "true"

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}

            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "signal.muellner.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: signal-cli-config
        globalMounts:
          - path: /home/.local/share/signal-cli
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      plugins:
        type: configMap
        name: signal-cli-plugins
        # mounted per file: the plugin loader walks /plugins recursively and
        # would register the copies in the configMap's ..timestamp dir twice
        globalMounts:
          - path: /plugins/alertmanager.def
            subPath: alertmanager.def
          - path: /plugins/alertmanager.lua
            subPath: alertmanager.lua
