---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signal-cli
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: signal-cli
      app.kubernetes.io/instance: signal-cli
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repositories
    - name: openebs
  interval: 10m
  path: ./kubernetes/apps/observability/signal-cli/app
  postBuild:
    substitute:
      APP: signal-cli
      KOPIUR_CLAIM: signal-cli-config
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
  wait: true
  targetNamespace: observability
