---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: host-zfs
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "VictoriaLogs"
          gethomepage.dev/group: "Observability"
          gethomepage.dev/weight: "40"
          gethomepage.dev/icon: "victoriametrics"
          gethomepage.dev/href: "https://vlogs.muellner.dev"
          gethomepage.dev/app: "victoria-logs"
          gethomepage.dev/pod-selector: "app.kubernetes.io/instance=victoria-logs,app.kubernetes.io/component=server"
        hostnames:
          - vlogs.muellner.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
