---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      config:
        receivers:
          - name: "null"
          - name: signal
            webhook_configs:
              # handled by the alertmanager plugin in signal-cli; the url holds
              # the sender number and group id and lives in a sops secret
              # TODO: switch to a templated `payload` against /v2/send once on
              # Alertmanager >= v0.35 (alertmanager#5098) and drop the plugin
              - url_file: /etc/alertmanager/secrets/alertmanager-signal/url
                send_resolved: true
          # informational one-shot messages, no "resolved" follow-up
          - name: signal-info
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-signal/url
                send_resolved: false
        route:
          receiver: signal
          group_by:
            - namespace
            - alertname
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            # keep in sync with the InfoInhibitor exemption below
            - receiver: signal-info
              matchers:
                - alertname =~ "ClusterUpgraded|LocalBackupsCompleted|OffsiteBackupCompleted"
        # chart defaults, except that the signal-info alerts are exempt from
        # InfoInhibitor: it fires for every info alert in a namespace without a
        # warning, so it would mute them before they are ever sent
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
              - alertname !~ "ClusterUpgraded|LocalBackupsCompleted|OffsiteBackupCompleted"
            equal:
              - namespace
          - target_matchers:
              - alertname = "InfoInhibitor"
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Alertmanager"
            gethomepage.dev/group: "Observability"
            gethomepage.dev/weight: "30"
            gethomepage.dev/icon: "alertmanager"
            gethomepage.dev/href: "https://alertmanager.muellner.dev"
            gethomepage.dev/app: "alertmanager"
          hostnames:
            - alertmanager.muellner.dev
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        externalUrl: https://alertmanager.muellner.dev
        secrets:
          - alertmanager-signal
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: host-zfs
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Prometheus"
            gethomepage.dev/group: "Observability"
            gethomepage.dev/weight: "20"
            gethomepage.dev/icon: "prometheus"
            gethomepage.dev/href: "https://prometheus.muellner.dev"
            gethomepage.dev/app: "prometheus"
            gethomepage.dev/widget.type: "prometheus"
            gethomepage.dev/widget.url: "http://kube-prometheus-stack-prometheus.observability:9090"
          hostnames:
            - prometheus.muellner.dev
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.muellner.dev
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: host-zfs
              resources:
                requests:
                  storage: 50Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      livenessProbe:
        timeoutSeconds: 5
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
      livenessProbe:
        timeoutSeconds: 5
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          dashboards: grafana
    defaultRules:
      disabled:
        # replaced by the job-rules below
        KubeJobFailed: true
        KubeJobNotCompleted: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      job-rules:
        groups:
          - name: jobs
            rules:
              # a failed job keeps firing until it is garbage collected, even after
              # later runs succeed, so cronjobs are judged by their last run instead
              # and kopiur backup/restore movers are covered by kopiur's own rules
              # (maintenance has no kopiur alert, so its failed Jobs still fire here)
              - alert: KubeJobFailed
                annotations:
                  summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete.
                expr: |-
                  kube_job_failed{job="kube-state-metrics"} > 0
                    unless on (namespace, job_name)
                  kube_job_owner{job="kube-state-metrics", owner_kind=~"CronJob|Snapshot|Restore"}
                for: 15m
                labels:
                  severity: warning
              - alert: KubeJobNotCompleted
                annotations:
                  summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} is taking more than 12 hours to complete.
                expr: |-
                  time() - max by (namespace, job_name) (
                    kube_job_status_start_time{job="kube-state-metrics"}
                      and
                    kube_job_status_active{job="kube-state-metrics"} > 0
                  ) > 43200
                labels:
                  severity: warning
              - alert: CronJobLastRunFailed
                annotations:
                  summary: The last run of CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} did not succeed.
                expr: |-
                  (
                    max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{job="kube-state-metrics"})
                      > on (namespace, cronjob)
                    max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{job="kube-state-metrics"})
                    or
                    max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{job="kube-state-metrics"})
                      unless on (namespace, cronjob)
                    kube_cronjob_status_last_successful_time{job="kube-state-metrics"}
                  )
                    and on (namespace, cronjob)
                  max by (namespace, cronjob) (kube_cronjob_status_active{job="kube-state-metrics"}) == 0
                for: 15m
                labels:
                  severity: warning
              # KubePodNotReady ignores job pods, so a job whose pod can't be
              # scheduled would otherwise go unnoticed. Grouped by job since
              # a Job controller may recreate the pending pod.
              - alert: KubeJobPodPending
                annotations:
                  summary: Job {{ $labels.namespace }}/{{ $labels.owner_name }} has had a pod stuck in Pending for more than 30 minutes.
                expr: |-
                  max by (namespace, owner_name) (
                    kube_pod_owner{job="kube-state-metrics", owner_kind="Job"}
                      * on (namespace, pod) group_left ()
                    (kube_pod_status_phase{job="kube-state-metrics", phase="Pending"} == 1)
                  ) > 0
                for: 30m
                labels:
                  severity: warning
      pod-rules:
        groups:
          - name: pods
            rules:
              # after an unplanned node reboot the old pods of deployments/
              # statefulsets are left behind as Completed/Error (talos upgrades
              # drain the node first, so they shouldn't trigger this)
              - alert: KubePodTerminatedNotCleanedUp
                annotations:
                  summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} has terminated and is not owned by a job. It needs to be cleaned up.
                expr: |-
                  max by (namespace, pod) (kube_pod_status_phase{job="kube-state-metrics", phase=~"Succeeded|Failed"} == 1)
                    unless on (namespace, pod)
                  kube_pod_owner{job="kube-state-metrics", owner_kind="Job"}
                for: 30m
                labels:
                  severity: warning
              # host-zfs binds immediately, so a pending claim means provisioning failed
              - alert: KubePersistentVolumeClaimPending
                annotations:
                  summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been Pending for more than 15 minutes. Check its events for provisioning errors.
                expr: kube_persistentvolumeclaim_status_phase{job="kube-state-metrics", phase="Pending"} == 1
                for: 15m
                labels:
                  severity: warning
      upgrade-rules:
        groups:
          - name: upgrades
            rules:
              # one Signal message per finished tuppr upgrade; failures are covered
              # by the PrometheusRule shipped with the tuppr chart. Uses the
              # completion timestamp since the counters reset when the reboot
              # restarts tuppr. The on () join assumes a single node.
              - alert: ClusterUpgraded
                annotations:
                  summary: >-
                    {{ $labels.upgrade_type | title }} upgrade finished: node runs Talos {{ $labels.talos_version }}, Kubernetes {{ $labels.kubernetes_version }}.
                expr: |-
                  max by (namespace, upgrade_type, name) (
                    time() - tuppr_upgrade_last_completion_timestamp_seconds{result="success"} < 3600
                  )
                    * on () group_left (talos_version, kubernetes_version)
                  max by (talos_version, kubernetes_version) (tuppr_node_info)
                labels:
                  severity: info
      backup-rules:
        groups:
          - name: backups
            rules:
              # one Signal message per day for each repository; failures are covered
              # by the PrometheusRule shipped with the kopiur chart. Sizes are
              # kopia's logical size of each source's latest snapshot (before
              # dedup/compression). The delta looks back 12h, between two daily
              # runs, as completion times drift with jitter and backup duration.
              # max by (namespace, policy) drops the pod label, which changes
              # whenever the controller restarts.
              - alert: OffsiteBackupCompleted
                annotations:
                  summary: >-
                    Photo backup to Hetzner finished: {{ with query `max(kopiur_policy_last_backup_size_bytes{policy="immich-photos"})` }}{{ . | first | value | humanize1024 }}B{{ end }} of data ({{ range query `max(kopiur_policy_last_backup_size_bytes{policy="immich-photos"}) - max(kopiur_policy_last_backup_size_bytes{policy="immich-photos"} offset 12h)` }}{{ if ge .Value 0.0 }}+{{ end }}{{ .Value | humanize1024 }}B{{ end }} since the previous backup).
                expr: |-
                  time() - max by (namespace, policy) (kopiur_policy_last_backup_success_timestamp_seconds{policy="immich-photos"}) < 3600
                labels:
                  severity: info
              # Grouped: fires once the last NAS policy has finished, so one failed
              # app suppresses the message for that day
              - alert: LocalBackupsCompleted
                annotations:
                  summary: >-
                    Local backups to the NAS finished: {{ with query `count(max by (namespace, policy) (kopiur_policy_last_backup_size_bytes{policy!="immich-photos"}))` }}{{ . | first | value }}{{ end }} apps, {{ with query `sum(max by (namespace, policy) (kopiur_policy_last_backup_size_bytes{policy!="immich-photos"}))` }}{{ . | first | value | humanize1024 }}B{{ end }} of data ({{ range query `sum(max by (namespace, policy) (kopiur_policy_last_backup_size_bytes{policy!="immich-photos"})) - sum(max by (namespace, policy) (kopiur_policy_last_backup_size_bytes{policy!="immich-photos"} offset 12h))` }}{{ if ge .Value 0.0 }}+{{ end }}{{ .Value | humanize1024 }}B{{ end }} since the previous backup).
                expr: |-
                  time() - min(max by (namespace, policy) (kopiur_policy_last_backup_success_timestamp_seconds{policy!="immich-photos"})) < 3600
                labels:
                  severity: info
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
