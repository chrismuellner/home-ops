---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    bandwidthManager:
      enabled: true
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Log policy violations instead of dropping them; disable once Hubble shows no unexpected
    # audit verdicts (hubble observe --verdict AUDIT)
    policyAuditMode: true
    rollOutCiliumPods: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    k8sServiceHost: localhost
    k8sServicePort: 7445

    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      replicas: 1
      rollOutPods: true

    l2announcements:
      enabled: true

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      # In-memory buffer for live `hubble observe` (~2min at this node's rate; must be 2^n-1).
      # History lives in VictoriaLogs via the exporter below.
      eventBufferCapacity: "16383"
      # Write policy verdicts (incl. AUDIT) and real drops as JSON to the agent's stdout, where the
      # VictoriaLogs collector picks them up. Query: kubernetes.container_name:cilium-agent flow.verdict:*
      export:
        static:
          enabled: true
          filePath: stdout
          allowList:
            # MessageTypePolicyVerdict: one event per new connection to a pod with a policy
            - '{"event_type":[{"type":5}]}'
            - '{"verdict":["DROPPED","ERROR"]}'
          denyList:
            # Constant datapath noise unrelated to policy
            - '{"drop_reason_desc":["VLAN_FILTERED","UNSUPPORTED_L3_PROTOCOL","CT_UNKNOWN_L4_PROTOCOL"]}'
          fieldMask:
            - time
            - verdict
            - drop_reason_desc
            - traffic_direction
            - policy_match_type
            - is_reply
            - IP.source
            - IP.destination
            - l4
            - source.identity
            - source.namespace
            - source.pod_name
            - source.workloads
            - destination.identity
            - destination.namespace
            - destination.pod_name
            - destination.workloads
            - destination_names
            - ingress_allowed_by
            - egress_allowed_by
            - ingress_denied_by
            - egress_denied_by
      metrics:
        enabled:
          - dns
          - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
          - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
        dashboards:
          enabled: true
