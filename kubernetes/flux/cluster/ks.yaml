---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/apps
  patches:
    - # Add Sops decryption to all Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - # Add HelmRelease defaults to all Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - # A passive kopiur populator Restore stays Pending until a new PVC claims
      # it, which kstatus reads as in-progress forever and would stall `wait`.
      # The patch replaces the whole list, so Kustomizations with their own
      # healthCheckExprs opt out via the label and carry this entry themselves
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          healthCheckExprs:
            - apiVersion: kopiur.home-operations.com/v1alpha1
              kind: Restore
              failed: status.conditions.filter(c, c.type == 'Stalled').exists(c, c.status == 'True')
              current: status.conditions.filter(c, c.type in ['Ready', 'AwaitingClaim']).exists(c, c.status == 'True')
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: "!home-ops/custom-health-check-exprs"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
