---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:=${APP}}"
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=host-zfs-snapshot}
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  # VolSync's effective retention: latest and annual came from kopia's global
  # policy, which kopiur does not inherit
  retention:
    keepLatest: 10
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
    keepAnnual: 3
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ${KOPIUR_STORAGECLASS:=host-zfs}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
