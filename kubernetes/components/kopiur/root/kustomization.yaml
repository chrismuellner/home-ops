---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Add after components/kopiur/backup for apps that run as root: their files can
# be root-owned 0600, which an unprivileged mover cannot read. Root plus
# privilegedMode grants DAC_OVERRIDE for backups and CHOWN/FOWNER for restores
# (original ownership is kept). The namespace needs the privileged-movers opt-in.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: &patch |-
      - op: replace
        path: /spec/mover/securityContext
        value:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
      - op: add
        path: /spec/mover/privilegedMode
        value: true
  - target:
      group: kopiur.home-operations.com
      kind: Restore
    patch: *patch
