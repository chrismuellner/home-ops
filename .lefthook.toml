# Run lefthook itself through mise so the git hook works without shell activation
lefthook = "mise x -- lefthook"

[pre-commit]
parallel = true

[pre-commit.commands.format-just]
run = """
for file in {staged_files}; do
    mise x -- just --justfile "$file" --fmt --unstable
done
"""
glob = ["*.just", ".justfile"]
stage_fixed = true

[pre-commit.commands.format-yaml]
run = "mise x -- yamlfmt {staged_files}"
glob = ["*.yaml"]
stage_fixed = true
