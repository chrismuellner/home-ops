min_version = "2026.11.3"

[tools]
# pre-commit hooks (.lefthook.toml)
lefthook = "2.2.2"
just = "1.59.0"
yamlfmt = "0.21.0"
# justfiles
flux2 = "2.10.0"
yq = "4.54.3"
helmfile = "1.8.4"
helm = "4.3.1"
# Renovate keeps these in sync with kubernetes/apps/system-upgrade/tuppr/upgrades/*.yaml
talosctl = "1.14.6"
kubectl = "1.37.2"
# secrets
sops = "3.13.3"

[settings]
lockfile_platforms = ["linux-x64"]

[hooks]
postinstall = "lefthook install"
