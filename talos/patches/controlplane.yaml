---
# etcd has no dedicated document yet, it stays in the v1alpha1 config
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381 # expose metrics for kube-prometheus-stack
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # Schematic: talos/schematic.yaml
  image: factory.talos.dev/metal-installer/7046abc7c40b0e28d7c1ec1ec73768b16ceb9a8e3d23b1f6c5c6bd4825273dc6:v1.14.2
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: false
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - system-upgrade
---
# Single node: allow workloads on the control plane and keep it as a load balancer target
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - cluster.local
extraArgs:
  feature-gates: MutatingAdmissionPolicy=true
  runtime-config: admissionregistration.k8s.io/v1beta1=true
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0 # expose metrics for kube-prometheus-stack
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0 # expose metrics for kube-prometheus-stack
---
# Cilium replaces kube-proxy and Flannel
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 250GB
  maxSize: 300GB
  grow: false
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: openebs-zfs
provisioning:
  diskSelector:
    match: system_disk
  minSize: 500GB
  maxSize: 800GB
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  imageMaximumGCAge: 168h # drop unused images after a week, Renovate bumps them often
  # Single node: give databases time to stop cleanly when tuppr reboots for upgrades
  shutdownGracePeriod: 90s
  shutdownGracePeriodCriticalPods: 60s
---
# Let non-root pods open devices (e.g. the iGPU) as their runAsUser/runAsGroup
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: device-ownership
content: |
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_watches: "1048576"
---
# Single node: reset automatically if it hangs
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
---
# Keep pre-1.14 behaviour: clusters upgraded from older versions run without it
apiVersion: v1alpha1
kind: SecurityProfileConfig
$patch: delete
